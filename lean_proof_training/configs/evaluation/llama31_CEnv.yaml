# Whole-proof generation and original-source Lean verification.
seed: 2026
architecture: ar
model:
  name_or_path: meta-llama/Llama-3.1-8B
  revision: d04e592bb4f6aa9cfee91e2e20afa771667e1d4b
  tokenizer_name_or_path: ${DATASET_ROOT}/tokenizers/llama31
  checkpoint: ${CHECKPOINT_ROOT}/llama31/full_sft_CEnv/best
  checkpoint_type: auto
  cache_dir: ${MODEL_CACHE}
  dtype: bfloat16
  trust_remote_code: false
  use_fast_tokenizer: true
data:
  test_file: ${DATASET_ROOT}/benchmark/test.jsonl
  tokenized_input_file: ${DATASET_ROOT}/tokenized/llama31/training/input_1024/views/CEnv/test.jsonl
  allowed_ids_file: ${DATASET_ROOT}/evaluation_populations/test_both_nonempty.jsonl
source:
  public_spans: true
  command_spans_root: ${DATASET_ROOT}/command_mapping/source_commands
  mathlib_root: ${MATHLIB_ROOT}
generation:
  context_view: CEnv
  input_limit: 1024
  max_new_tokens: 1024
  max_sequence_length: 2048
  candidate_batch_size: 1
  num_diffusion_steps: 64
  mask_token_id: null
  sampled:
    num_candidates: 32
    temperature: 0.6
    top_p: 0.95
    top_k: 0
  greedy:
    num_candidates: 1
    temperature: 0
verification:
  lean_command: lake env lean
  preflight_import: Mathlib
  gold_preflight_samples: 8
  jobs: 8
  timeout_seconds: 60
  heartbeat_policy: source_inherited
  resume: true
  keep_lean_files: false
  keep_failed_lean_files: true
evaluation:
  max_samples: 0
  require_all_targets: true
  expected_population_size: 11064
output:
  directory: ${EVAL_ROOT}/llama31/full_sft_CEnv
