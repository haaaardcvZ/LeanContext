[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-proof-training"
version = "0.2.0"
description = "Paired-context DLLM and Llama-3.1 training for Lean proofs"
requires-python = ">=3.10"
dependencies = [
  "torch==2.6.0",
  "accelerate>=1.1,<2",
  "safetensors>=0.4.5",
  "pyyaml>=6.0.2",
  "tqdm>=4.67",
]

[project.optional-dependencies]
dllm = ["transformers==4.38.2", "peft==0.10.0"]
llama31 = ["transformers==4.45.2", "peft==0.13.2", "sentencepiece>=0.2"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
